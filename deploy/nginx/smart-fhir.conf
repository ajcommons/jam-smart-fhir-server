# ── AJ Smart FHIR Authorization Server — nginx configuration ─────────────────
#
# Option A: nginx terminates TLS, forwards plain HTTP to Spring on port 9000.
# This is the recommended setup for production.
#
# Prerequisites
# ─────────────
#   1. Install nginx:  apt install nginx  (Debian/Ubuntu)
#   2. Obtain a TLS certificate via Let's Encrypt:
#        apt install certbot python3-certbot-nginx
#        certbot --nginx -d auth.yourdomain.com
#      Or supply your own cert (see ssl_certificate / ssl_certificate_key below).
#
# Installation
# ────────────
#   cp smart-fhir.conf /etc/nginx/sites-available/smart-fhir
#   ln -s /etc/nginx/sites-available/smart-fhir /etc/nginx/sites-enabled/
#   nginx -t          # verify config
#   systemctl reload nginx
#
# Required changes before use
# ───────────────────────────
#   Replace every occurrence of auth.yourdomain.com with your actual domain.
#   Update cert paths if not using Let's Encrypt.
#   Set ISSUER_URL=https://auth.yourdomain.com when starting the Spring app.
# ─────────────────────────────────────────────────────────────────────────────

# Redirect all HTTP traffic to HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name auth.yourdomain.com;

    # Allow Let's Encrypt ACME challenge (certbot uses this to renew certs)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — TLS termination + reverse proxy to Spring
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name auth.yourdomain.com;

    # ── TLS certificates ──────────────────────────────────────────────────────
    # Let's Encrypt (certbot sets these paths automatically):
    ssl_certificate     /etc/letsencrypt/live/auth.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.yourdomain.com/privkey.pem;

    # ── TLS hardening ─────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;              # TLS 1.3 ignores this; off is safer for 1.2
    ssl_session_cache         shared:SSL:10m;  # shared across worker processes
    ssl_session_timeout       1d;
    ssl_session_tickets       off;             # disable — improves forward secrecy
    ssl_stapling              on;              # OCSP stapling — faster cert validation
    ssl_stapling_verify       on;
    resolver                  8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout          5s;

    # ── Security headers ──────────────────────────────────────────────────────
    # HSTS — tells browsers to always use HTTPS for this domain for 2 years.
    # WARNING: Only enable this once you are confident HTTPS works correctly.
    #          Misconfigured HSTS can lock users out of your domain.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Prevent clickjacking — SMART launch pages must not be iframed
    add_header X-Frame-Options DENY always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options nosniff always;

    # Basic XSS protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy — don't leak the full URL in referrer headers
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Proxy to Spring Boot on port 9000 ─────────────────────────────────────
    location / {
        proxy_pass              http://127.0.0.1:9000;

        # Required: tell Spring the original protocol was HTTPS
        # Spring uses X-Forwarded-Proto to build https:// URLs for:
        #   - /.well-known/smart-configuration (issuer, endpoints)
        #   - id_token 'iss' claim
        #   - OAuth2 redirect_uri validation
        proxy_set_header        X-Forwarded-Proto  $scheme;
        proxy_set_header        X-Forwarded-Host   $host;
        proxy_set_header        X-Forwarded-Port   $server_port;

        # Standard reverse proxy headers
        proxy_set_header        Host               $host;
        proxy_set_header        X-Real-IP          $remote_addr;
        proxy_set_header        X-Forwarded-For    $proxy_add_x_forwarded_for;

        # Connection settings
        proxy_http_version      1.1;
        proxy_set_header        Connection         "";   # keep-alive to upstream
        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;

        # Buffer settings — prevents slow-client attacks on the Spring thread
        proxy_buffering         on;
        proxy_buffer_size       4k;
        proxy_buffers           8 4k;
    }

    # ── Static asset caching (optional) ──────────────────────────────────────
    # If you add CSS/JS to the Spring app, cache them at the edge
    location ~* \.(css|js|woff2?|png|ico|svg)$ {
        proxy_pass   http://127.0.0.1:9000;
        expires      7d;
        add_header   Cache-Control "public, immutable";
    }

    # ── Health check endpoint — no auth required ───────────────────────────
    location /actuator/health {
        proxy_pass   http://127.0.0.1:9000;
        access_log   off;        # don't pollute logs with health checks
    }
}
