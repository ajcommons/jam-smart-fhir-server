name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ── Auth server ─────────────────────────────────────────────────────────
      # Tests run against H2 in-memory (test profile) — no Postgres needed in CI.
      # application.yml in src/test/resources configures H2 + Flyway disabled.
      - name: Build & test smart-auth-server
        working-directory: smart-auth-server
        run: mvn -B verify --no-transfer-progress
        env:
          # Satisfy @Value bindings that have no default in test context
          SPRING_PROFILES_ACTIVE: dev

      # ── Smart client ────────────────────────────────────────────────────────
      - name: Build & test smart-client
        working-directory: smart-client
        run: mvn -B verify --no-transfer-progress

      # ── Artifact upload on failure ───────────────────────────────────────────
      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            smart-auth-server/target/surefire-reports/
            smart-client/target/surefire-reports/
          retention-days: 7

  # ── Secret scanning ─────────────────────────────────────────────────────────
  # Lightweight check: fail fast if a real credential pattern appears in source.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
